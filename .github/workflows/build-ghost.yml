name: Build Ghost Hunter (APK + EXE)
# فحص عميل معلق - المبرمج محمد سعيد
# كل تحديث بيطلّع نسخة الفون ونسخة الكمبيوتر بنفس رقم الإصدار
on:
  push:
    paths:
      - 'ghost/**'
      - '.github/workflows/build-ghost.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ghost-build
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key (optional)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ghost/app/release.jks; fi
      - name: Build APK
        working-directory: ghost
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && gradle assembleDebug --no-daemon
      - run: cp ghost/app/build/outputs/apk/debug/app-debug.apk MsaeedGhostHunter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: MsaeedGhostHunter.apk

  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Build Windows EXE
        working-directory: ghost/desktop
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npm ci --no-audit --no-fund
          sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: ghost/desktop/dist/MsaeedGhostHunter.exe

  publish:
    needs: [apk, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Version info
        run: |
          NOTE=$(head -n1 ghost/release-notes.txt 2>/dev/null || true)
          ENG=$(cat ghost/engine-version.txt 2>/dev/null || echo 1)
          jq -n --arg n "$NOTE" --argjson c "$GITHUB_RUN_NUMBER" --argjson e "$ENG" '{code:$c,name:("1."+($c|tostring)),notes:$n,engine:$e}' > out/version.json
          cp ghost/app/src/main/assets/index.html out/index.html
          ls -la out; cat out/version.json
      # الملفات الأول، وversion.json في الآخر عشان البرامج ماتشوفش التحديث قبل ما ملفاته تبقى جاهزة
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ghost-latest
          name: فحص عميل معلق - آخر نسخة
          make_latest: false
          files: |
            out/MsaeedGhostHunter.apk
            out/MsaeedGhostHunter.exe
            out/index.html
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ghost-latest
          make_latest: false
          files: out/version.json
