name: Build Ghost Hunter APK
on:
  push:
    paths:
      - 'ghost/**'
      - '.github/workflows/build-ghost.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key (optional)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ghost/app/release.jks; fi
      - name: Build
        working-directory: ghost
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && gradle assembleDebug --no-daemon
      - run: cp ghost/app/build/outputs/apk/debug/app-debug.apk MsaeedGhostHunter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MsaeedGhostHunter-apk
          path: MsaeedGhostHunter.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ghost-latest
          name: صياد الشبح - آخر نسخة
          files: MsaeedGhostHunter.apk
          make_latest: false
      - name: Version info
        run: |
          NOTE=$(head -n1 ghost/release-notes.txt 2>/dev/null || true)
          ENG=$(cat ghost/engine-version.txt 2>/dev/null || echo 1)
          jq -n --arg n "$NOTE" --argjson c "$GITHUB_RUN_NUMBER" --argjson e "$ENG" '{code:$c,name:("1."+($c|tostring)),notes:$n,engine:$e}' > version.json
          cp ghost/app/src/main/assets/index.html index.html
          cat version.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ghost-latest
          files: |
            version.json
            index.html
          make_latest: false
