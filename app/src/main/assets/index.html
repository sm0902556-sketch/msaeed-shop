<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محل الأدوات المنزلية</title>
<style>
/* VOICE: practical shop ledger, calm and fast to use with one thumb
   IDEA: a shop's daily notebook: today's due installments on top
   PICTURE: the due list itself is the hero
   COLOUR and TYPE: white, cobalt #1d4ed8, coral accent #f97352, system Arabic sans
   LAYOUT: sticky bottom tabs, single column cards, modal forms */
:root{color-scheme:light dark;--bg:light-dark(#f4f6fb,#0d1220);--card:light-dark(#fff,#161d31);--ink:light-dark(#111827,#e8ecf6);--mut:light-dark(#5b6476,#9aa4ba);--pri:#1d4ed8;--acc:#f97352;--ok:#0f9d58;--bad:#dc2626;--line:light-dark(#e3e7ef,#263052)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Cairo","Segoe UI",Tahoma,system-ui,sans-serif;padding-bottom:80px;overflow-x:clip}
header{background:linear-gradient(160deg,#1d4ed8 0%,#1e3a8a 100%);color:#fff;padding:18px 16px 0;overflow:hidden}
.hd{max-width:900px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:end}
header .tt{padding-bottom:16px;align-self:center}
header .kicker{font-size:14px;opacity:.85;margin:0 0 4px}
header h1{margin:0;font-size:clamp(22px,5.4vw,34px);line-height:1.15;text-wrap:balance}
header small{display:block;opacity:.85;margin-top:6px;font-size:14px}
header svg{width:100%;height:auto;display:block}
header .wrap{position:relative}
.ribbon{position:relative;margin:-10px auto 14px;width:fit-content;max-width:96%;background:#fff;color:#1e3a8a;border-radius:12px;padding:6px 14px;box-shadow:0 6px 18px #0004;text-align:center;font-size:14px;line-height:1.45;border-bottom:3px solid #f97352}
.ribbon b{display:block;font-size:15px}
@media(max-width:600px){.hd{grid-template-columns:1fr}header .tt{padding-bottom:4px}header svg{max-width:420px;margin:auto}}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.qa button{flex-direction:column;gap:4px;min-height:76px;font-size:14px;font-weight:700;justify-content:center;border-radius:14px}
.qa button i{font-style:normal;font-size:22px;line-height:1;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips button{flex:none;min-height:38px;padding:4px 14px;border-radius:99px;font-size:14px}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sec{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:17px;font-weight:700}
.sec span{color:var(--mut);font-weight:400;font-size:14px}
main{max-width:900px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;white-space:nowrap}
.stat span{color:var(--mut);font-size:14px}
.stat.red b{color:var(--bad)}.stat.blue b{color:var(--pri)}
h2{font-size:19px;margin:6px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:99px;background:light-dark(#eef2ff,#1e2a4d);color:var(--pri)}
.tag.late{background:light-dark(#fee2e2,#3b1414);color:var(--bad)}
.tag.ok{background:light-dark(#dcfce7,#0f2e1c);color:var(--ok)}
button,.btn{font:inherit;font-size:15px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
button.wa,.btn.wa{background:#25d366;color:#fff;border-color:#25d366}
button.d{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;margin:8px 0 4px;font-size:14px;color:var(--mut)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
nav button{border:0;border-radius:0;flex-direction:column;gap:0;font-size:13px;min-height:62px;background:none;justify-content:center}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--pri);font-weight:700}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.toast{position:fixed;bottom:90px;inset-inline:16px;margin:auto;max-width:420px;background:#111827;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:10;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}
td.n{white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:20px 6px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px}
footer a{color:var(--pri)}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.5}}}
</style>
</head>
<body>
<header><div class="hd"><div class="tt"><p class="kicker">أهلاً بيك في</p><h1 id="shopName">محل الإخوة للأدوات الكهربائية والمنزلية</h1><small id="todayLbl"></small></div><div class="wrap"><svg viewBox="0 0 400 190" role="img" aria-label="غسالة وتلاجة وميكروويف وسخان">

<g transform="translate(186,74)"><rect x="0" y="0" width="98" height="110" rx="10" fill="url(#gW)"/><rect x="0" y="0" width="98" height="24" rx="10" fill="#e3e9f6"/><circle cx="18" cy="12" r="5" fill="#f97352"/><rect x="34" y="8" width="32" height="8" rx="4" fill="#9fb0d1"/><circle cx="82" cy="12" r="4" fill="#9fb0d1"/><circle cx="49" cy="67" r="34" fill="#c7d2ea"/><circle cx="49" cy="67" r="27" fill="url(#gG)"/><path d="M28 74q10-9 21 0t21 0" stroke="#e6f0ff" stroke-width="3" fill="none" opacity=".8"/><circle cx="40" cy="57" r="6" fill="#fff" opacity=".55"/></g>
<!-- microwave on top of counter -->
<g transform="translate(294,108)"><rect x="-6" y="40" width="108" height="36" rx="4" fill="#f4b183"/><rect x="-6" y="40" width="108" height="6" rx="3" fill="#ffd2b0"/><rect x="0" y="0" width="96" height="40" rx="6" fill="url(#gS)"/><rect x="8" y="7" width="58" height="26" rx="4" fill="#1f2937"/><rect x="12" y="11" width="22" height="18" rx="2" fill="#374151"/><rect x="72" y="8" width="16" height="7" rx="2" fill="#1d4ed8"/><circle cx="76" cy="22" r="2.6" fill="#7b88a8"/><circle cx="84" cy="22" r="2.6" fill="#7b88a8"/><circle cx="76" cy="30" r="2.6" fill="#7b88a8"/><circle cx="84" cy="30" r="2.6" fill="#f97352"/></g>
</svg><div class="ribbon"><b id="addrLbl">📍 محطة سيلا — أمام محطة القطار</b><span id="mgrLbl">إدارة / حماده توبه</span></div></div></div></header>
<main id="view"></main>
<footer>برمجة: M saeed — واتساب <a href="https://wa.me/201123840671">01123840671</a></footer>

 <button data-t="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
 <button data-t="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>المخزن</button>
 <button data-t="cust"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>العملاء</button>
 <button data-t="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.1V4a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 0 1 0 4z"/></svg>الإعدادات</button>

<script>
{
const K='msaeed_shop_v1';
const defSet=()=>({shop:'محل الإخوة للأدوات الكهربائية والمنزلية',owner:'M saeed',phone:'01123840671',addr:'محطة سيلا — أمام محطة القطار',mgr:'حماده توبه',days:3,hour:10,
 tpl:'أهلاً أستاذ {الاسم} 👋\nتذكير من {المحل}: قسط {البند} رقم {رقم_القسط} بقيمة {المبلغ} جنيه مستحق يوم {التاريخ}.\nالمتبقي عليك: {المتبقي} جنيه.\nالعنوان: {العنوان}\nللتواصل: {رقمي}\nشكراً لحضرتك 🙏'});
const def=()=>({settings:defSet(),products:[],moves:[],customers:[],debts:[]});
let S=load(),tab='home',q='',cf='all',sf='items',cat='';
if(S.settings.shop==='محل الأدوات المنزلية'){S.settings.shop=defSet().shop;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(K);if(r){const d=JSON.parse(r);const o=Object.assign(def(),d);o.settings=Object.assign(defSet(),d.settings||{});return o}}catch(e){}return def()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('مشكلة في الحفظ')}syncNative()}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(',','.'));return isFinite(n)?n:0};
const money=n=>Math.round(n).toLocaleString('ar-EG')+' ج';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
function addMonths(s,k){const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return ymd(t)}
function addDays(s,k){const[y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+k))}
const fmtD=s=>{if(!s)return'';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
function intl(p){p=String(p||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0'))p='20'+p.slice(1);return p}
const waLink=(p,msg)=>'https://wa.me/'+intl(p)+'?text='+encodeURIComponent(msg);
const cust=id=>S.customers.find(c=>c.id===id)||{name:'؟',phone:''};
const prod=id=>S.products.find(p=>p.id===id);

/* installments */
function sched(d){const fin=Math.max(0,d.total-d.down),n=Math.max(1,d.months|0),m=d.monthly>0?d.monthly:Math.ceil(fin/n);const out=[];let rem=fin;for(let i=0;i<n&&rem>0.001;i++){const a=i===n-1?rem:Math.min(m,rem);out.push({n:i+1,date:addMonths(d.first,i),amount:a});rem-=a}return out}
function st(d){const paid=(d.pays||[]).reduce((a,p)=>a+p.a,0),s=sched(d),t=today();let cum=0,next=null,late=0,lateAmt=0;
 for(const x of s){cum+=x.amount;if(cum>paid+0.001){const left=Math.min(x.amount,cum-paid);if(!next)next={...x,left};if(x.date<t){late++;lateAmt+=left}}}
 return{paid,remaining:Math.max(0,d.total-d.down-paid),next,late,lateAmt,s}}
function msgFor(d){const c=cust(d.cid),x=st(d),n=x.next;const T=S.settings;
 return T.tpl.replace(/{الاسم}/g,c.name).replace(/{المحل}/g,T.shop).replace(/{البند}/g,d.item).replace(/{رقم_القسط}/g,n?n.n:'').replace(/{المبلغ}/g,n?Math.round(n.left+x.lateAmt-(n.date<today()?n.left:0)):0).replace(/{التاريخ}/g,n?fmtD(n.date):'').replace(/{المتبقي}/g,Math.round(x.remaining)).replace(/{رقمي}/g,T.phone).replace(/{العنوان}/g,T.addr).replace(/{المدير}/g,T.mgr).replace(/{اسمي}/g,T.owner)}
function dueList(days){const t=today(),lim=addDays(t,days);return S.debts.map(d=>({d,x:st(d)})).filter(o=>o.x.next&&o.x.next.date<=lim).sort((a,b)=>a.x.next.date<b.x.next.date?-1:1)}
function ownerSummary(){const L=dueList(S.settings.days);if(!L.length)return'مفيش أقساط مستحقة النهارده 👍';
 return'📋 ملخص الأقساط ('+fmtD(today())+')\n'+L.map(o=>{const c=cust(o.d.cid);return'• '+c.name+' ('+c.phone+') — '+o.d.item+': '+Math.round(o.x.next.left)+' ج يوم '+fmtD(o.x.next.date)+(o.x.late?' ⚠️ متأخر '+o.x.late+' قسط':'')}).join('\n')}
function syncNative(){try{if(window.Android&&Android.setDue){const arr=[];S.debts.forEach(d=>{const x=st(d);let cum=0;const paid=x.paid;x.s.forEach(i=>{cum+=i.amount;if(cum>paid+0.001)arr.push({date:i.date,name:cust(d.cid).name,amount:Math.round(i.amount)})})});Android.setDue(JSON.stringify(arr.slice(0,500)),S.settings.hour|0)}}catch(e){}}
function openWA(url){try{if(window.Android&&Android.openUrl){Android.openUrl(url);return}}catch(e){}location.href=url}

/* modal */
function modal(title,html,onSave,saveTxt){$('#sheet').innerHTML='<div class="row"><h2 class="sp">'+esc(title)+'</h2><button id="mx" aria-label="إغلاق">✕</button></div><form id="mf">'+html+(onSave?'<div class="row" style="margin-top:14px"><button class="p sp" type="submit">'+(saveTxt||'حفظ')+'</button></div>':'')+'</form>';
 $('#modal').classList.add('on');$('#mx').onclick=close;$('#mf').onsubmit=e=>{e.preventDefault();if(onSave&&onSave(new FormData(e.target))!==false){close()}}}
function close(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
const F=(n,l,v,t,extra)=>'<label for="f_'+n+'">'+l+'</label><input id="f_'+n+'" name="'+n+'" type="'+(t||'text')+'" value="'+esc(v??'')+'" '+(extra||'')+'>';

/* views */
function render(){$('#shopName').textContent=S.settings.shop;$('#addrLbl').textContent='📍 '+S.settings.addr;$('#mgrLbl').textContent=S.settings.mgr?'إدارة / '+S.settings.mgr:'';$('#todayLbl').textContent=''+new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#view').innerHTML=({home:vHome,stock:vStock,cust:vCust,set:vSet})[tab]()}
function dueRow(o){const c=cust(o.d.cid),n=o.x.next;return'<div class="item"><div class="row"><b class="sp">'+esc(c.name)+'</b>'+(o.x.late?'<span class="tag late">متأخر '+o.x.late+'</span>':n.date===today()?'<span class="tag">النهارده</span>':'<span class="tag ok">'+fmtD(n.date)+'</span>')+'</div><div class="mut">'+esc(o.d.item)+' — قسط '+n.n+' : <b>'+money(n.left)+'</b> — المتبقي '+money(o.x.remaining)+'</div><div class="row" style="margin-top:6px"><button class="wa" data-wa="'+o.d.id+'">واتساب للعميل</button><button data-pay="'+o.d.id+'">تسجيل دفع</button><button data-open="'+o.d.cid+'">التفاصيل</button></div></div>'}
function vHome(){const t=today();const all=S.debts.map(d=>({d,x:st(d)}));const tot=all.reduce((a,o)=>a+o.x.remaining,0),lateN=all.filter(o=>o.x.late).length;
 const sales=S.moves.filter(m=>m.type==='out'&&m.date===t).reduce((a,m)=>a+m.qty*m.price,0);const coll=S.debts.reduce((a,d)=>a+(d.pays||[]).filter(p=>p.d===t).reduce((b,p)=>b+p.a,0),0);
 const L=dueList(S.settings.days),low=S.products.filter(p=>p.qty<=(p.min||2));
 return'<div class="qa"><button data-act="sell"><i style="background:#dc2626">↑</i>بيع</button><button data-act="buy"><i style="background:#0f9d58">↓</i>وارد</button><button data-act="newDebt"><i style="background:#1d4ed8">＋</i>تقسيط</button><button data-act="newCust"><i style="background:#f97352">☺</i>عميل</button></div>'+

 if(ds.dm){const m=S.moves.find(x=>x.id===ds.dm);if(m&&confirm('تمسح الحركة؟ (الكمية هترجع زي ما كانت)')){const p=prod(m.pid);if(p)p.qty+=m.type==='in'?-m.qty:m.qty;S.moves=S.moves.filter(x=>x!==m);save();render()}return}
 if(ds.dd){const d=S.debts.find(x=>x.id===ds.dd);if(d&&confirm('تمسح بند "'+d.item+'"؟')){S.debts=S.debts.filter(x=>x!==d);save();openCust(d.cid);render()}return}
 if(ds.dp){const[did,pid]=ds.dp.split('|');const d=S.debts.find(x=>x.id===did);if(d&&confirm('تمسح الدفعة دي؟')){d.pays=d.pays.filter(p=>p.id!==pid);save();openCust(d.cid);render()}return}
 if(b.id==='sumMe'){openWA(waLink(S.settings.phone,ownerSummary()));return}
 const a=ds.act;if(!a)return;
 if(a==='newProd')fProd();else if(a==='newMove')fMove();else if(a==='sell')fMove('out');else if(a==='buy')fMove('in');else if(a==='newCust')fCust();else if(a==='newDebt')fDebt();else if(a==='backup')backup();else if(a==='restore')restore();
 else if(a==='wipe'&&confirm('متأكد؟ كل البيانات هتتمسح نهائي.')&&confirm('آخر تأكيد: امسح كل حاجة؟')){S=def();save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='srch'){q=e.target.value;const pos=e.target.selectionStart;render();const s=$('#srch');s.focus();try{s.setSelectionRange(pos,pos)}catch(x){}}});
document.addEventListener('submit',e=>{if(e.target.id!=='setf')return;e.preventDefault();const fd=new FormData(e.target);Object.assign(S.settings,{shop:fd.get('shop').trim()||'المحل',addr:fd.get('addr').trim(),mgr:fd.get('mgr').trim(),owner:fd.get('owner').trim(),phone:fd.get('phone').trim(),days:Math.max(0,num(fd.get('days'))|0),hour:Math.min(23,Math.max(0,num(fd.get('hour'))|0)),tpl:fd.get('tpl')});save();render();toast('تم حفظ الإعدادات')});
window.addEventListener('popstate',()=>close());
render();syncNative();
}
</script>
</body>
</html>
