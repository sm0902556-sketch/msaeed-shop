plugins { id 'com.android.application' }
android {
    namespace 'com.msaeed.shop'
    compileSdk 34
    defaultConfig {
        applicationId "com.msaeed.temsah"
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    signingConfigs {
        debug {
            if (file('release.jks').exists()) {
                storeFile file('release.jks')
                storePassword 'elekhwa2026'
                keyAlias 'elekhwa'
                keyPassword 'elekhwa2026'
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/DEPENDENCIES']
        }
    }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
