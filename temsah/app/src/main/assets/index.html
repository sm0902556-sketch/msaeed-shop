<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التمساح للملابس</title>
<style>
/* VOICE: a busy clothes-shop counter, calm and quick with one thumb
   IDEA: the shop's cash drawer: sell first, stock and people one tap away
   PICTURE: a drawn shop front with racks, a mannequin and the crocodile sign
   COLOUR and TYPE: warm paper #f5f3ee, crocodile teal #2b7a64, amber for low stock, system Arabic sans
   LAYOUT: El-Ekhwa style header, sticky 5-tab bottom bar, single column cards, bottom sheets */
:root{color-scheme:light dark;--bg:light-dark(#f5f3ee,#0f1613);--card:light-dark(#fff,#17211d);--ink:light-dark(#1d2421,#e6eeea);--mut:light-dark(#6b736f,#9fb0a8);--pri:#2b7a64;--pri2:#1f5c4b;--acc:#c98a1b;--ok:#1f9d63;--bad:#d23b3b;--line:light-dark(#e6e2da,#26332d);--soft:light-dark(#eaf3ef,#1b2d26)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Cairo","Segoe UI",Tahoma,system-ui,sans-serif;padding-bottom:84px;overflow-x:clip}
header{background:light-dark(#fbf8f2,#14201b);color:var(--pri2);border-bottom:4px solid var(--pri);padding:16px 16px 0;overflow:hidden}
.hd{max-width:900px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:end}
header .tt{padding-bottom:16px;align-self:center}
header .kicker{font-size:14px;opacity:.85;margin:0 0 2px;color:var(--mut)}
header h1{margin:0;font-size:clamp(22px,5.4vw,34px);line-height:1.15;color:light-dark(#1f5c4b,#bfe6d8);text-wrap:balance}
header h1 small{display:block;font-size:.55em;color:var(--acc);margin-top:4px;font-weight:700}
#todayLbl{display:block;color:var(--mut);margin-top:6px;font-size:14px}
header svg{width:100%;height:auto;display:block}
.ribbon{position:relative;margin:-10px auto 14px;width:fit-content;max-width:96%;background:light-dark(#fff,#1c2a24);color:light-dark(#1f5c4b,#cfeee2);border-radius:12px;padding:6px 16px;box-shadow:0 6px 18px #0003;text-align:center;font-size:14px;line-height:1.5;border-bottom:3px solid var(--acc)}
.ribbon b{display:block;font-size:15px}.ribbon a{color:var(--pri);font-weight:700;text-decoration:none;display:block;direction:ltr}
header .tt{display:flex;gap:12px;align-items:center}
header .lg{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--acc);box-shadow:0 4px 12px #0002}
header .bn{width:100%;max-width:620px;margin:auto;height:auto;display:block;border-radius:16px;box-shadow:0 8px 22px #0003}
header .art{padding-bottom:14px}
.ribbon{margin:-14px auto 0}
body.t-sell header .tt{display:none}body.t-sell .hd{grid-template-columns:1fr}body.t-sell header{padding-top:12px}
@media(max-width:600px){.hd{grid-template-columns:1fr}header .tt{padding-bottom:4px}header svg{max-width:420px;margin:auto}}
body:not(.t-sell) header .art{display:none}body:not(.t-sell) .hd{grid-template-columns:1fr}body:not(.t-sell) header .tt{padding-bottom:12px}body:not(.t-sell) header h1{font-size:22px}
main{max-width:900px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.sec{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-size:17px;font-weight:700}.sec span{color:var(--mut);font-weight:400;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mut);font-size:14px}.warn{color:var(--acc);font-size:14px}.red{color:var(--bad)}.grn{color:var(--ok)}
button,.btn{font:inherit;font-size:15px;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button.p{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
button.big{width:100%;min-height:54px;font-size:17px;border-radius:14px}
button.wa{background:#25d366;color:#fff;border-color:#25d366}
button.d{color:var(--bad)}button.ghost{background:none;border-color:transparent}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label{display:block;margin:8px 0 4px;font-size:14px;color:var(--mut)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips button{flex:none;min-height:38px;padding:4px 14px;border-radius:99px;font-size:14px}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:light-dark(#ebe8e1,#1b2620);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;min-height:42px}.seg button.on{background:var(--card);box-shadow:0 1px 4px #0002;font-weight:700;color:var(--pri)}
.pc{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.pc .pr{text-align:start;white-space:nowrap}.pc .pr b{font-size:18px;display:block}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat span{color:var(--mut);font-size:14px}.stat b{display:block;font-size:24px;white-space:nowrap}
.stat.w{grid-column:1/-1}.stat.g b{color:var(--ok)}.stat.r b{color:var(--bad)}
.item{border-top:1px solid var(--line);padding:10px 0}.item:first-child{border-top:0}
.tag{display:inline-block;font-size:13px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--pri);white-space:nowrap}
.tag.late{background:light-dark(#fde4e4,#3a1616);color:var(--bad)}.tag.ok{background:light-dark(#dcf5e8,#11301f);color:var(--ok)}.tag.am{background:light-dark(#fbf0d9,#33280f);color:var(--acc)}
.menu button{width:100%;justify-content:flex-start;text-align:start;min-height:66px;margin-bottom:10px;padding:10px 14px;border-radius:14px}
.menu button div{flex:1}.menu button small{display:block;color:var(--mut);font-size:13px;font-weight:400}.menu button i{font-style:normal;font-size:22px;width:28px;text-align:center}
.menu button::after{content:'‹';color:var(--mut);font-size:20px}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchips button{flex-direction:column;gap:0;min-width:84px;line-height:1.3}
.vchips button small{color:var(--mut);font-size:12px}
.qty{display:flex;align-items:center;gap:4px}.qty button{min-height:36px;min-width:36px;padding:0;border-radius:10px}.qty b{min-width:26px;text-align:center}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 76px 40px;gap:6px;margin-bottom:6px}.vrow button{padding:0}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;padding:8px 2px}
.res{position:relative}.res .list{margin-top:6px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;border-radius:0;flex-direction:column;gap:2px;font-size:13px;min-height:64px;background:none;color:var(--mut)}
nav button svg{width:24px;height:24px}nav button.on{color:var(--pri);font-weight:800}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9}.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.sheet h2{font-size:19px;margin:4px 0}
.toast{position:fixed;bottom:92px;inset-inline:16px;margin:auto;max-width:420px;background:#1d2421;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:12;text-align:center}
.ask{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:11;padding:20px}.ask.on{display:flex}
.ask .box{background:var(--card);border-radius:18px;padding:18px;max-width:380px;width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}td.n{white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:18px 6px}
.cashier{background:var(--acc);color:#fff;text-align:center;font-size:14px;padding:4px;font-weight:700}
footer{padding:14px 12px 10px;text-align:center}
.badge{max-width:420px;margin:auto;background:light-dark(#fbf8f2,#17211d);border:1px solid var(--line);border-bottom:4px solid var(--acc);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;text-align:start}
.badge .av{flex:none;width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#2b7a64,#1f5c4b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.05;direction:ltr;font-family:Georgia,serif}
.badge .av span:first-child{font-size:20px}.badge .av span:last-child{font-size:12px}
.badge small{display:block;color:var(--mut);font-size:13px}.badge b{display:block;font-size:17px;color:light-dark(#1f5c4b,#bfe6d8)}
.badge .ph{display:block;text-align:right;font-size:14px;color:var(--mut);direction:ltr}
.badge button{flex:none;border-radius:99px;background:#25d366;color:#fff;border:0;font-weight:700}
#verLbl{color:var(--mut);font-size:13px;margin-top:8px}
.rcpt{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px;font-size:15px}
.rcpt .h{text-align:center;border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px}
@media(min-width:1000px){main{max-width:1000px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.modal{align-items:center}.sheet{border-radius:20px}}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.5}}}
</style>
</head>

 '<div class="sec">قارب على النفاد</div><div class="card">'+(low.length?low.map(([n,v])=>'<div class="item row"><span class="sp">'+esc(n)+' <span class="mut">'+esc(vName(v))+'</span></span><span class="tag am">'+v.qty+'</span></div>').join(''):'<div class="empty">المخزون تمام 👍</div>')+'</div>'+
 '<div class="sec">الفواتير</div><div class="card">'+(S.sales.filter(s=>inP(s.d)).length?S.sales.filter(s=>inP(s.d)).slice().reverse().slice(0,40).map(s=>'<div class="item row" data-inv="'+s.id+'" style="cursor:pointer"><span class="sp">#'+s.no+' — '+esc(s.cid?cust(s.cid).name:'زبون')+(s.ret?' <span class="tag late">مرتجع</span>':'')+'<div class="mut">'+fmtD(s.d)+' '+esc(s.time)+'</div></span><b>'+money(s.total)+'</b></div>').join(''):'<div class="empty">مفيش فواتير</div>')+'</div>'}

/* ===== more ===== */
function vMore(){const M=[['buyInv','🧾','فاتورة شراء من مورد','تزود المخزون وتسجل المستحق للمورد'],['exp','💸','تسجيل مصروف','إيجار، كهرباء، مرتبات...'],['settings','⚙️','الإعدادات ورسائل التذكير','اسم المحل، الإدارة، رسالة القسط'],['backup','💾','نسخة احتياطية / استرجاع','احفظ بياناتك وابعتها لنفسك'],['cashier',cashier?'🔓':'🔒',cashier?'الخروج من وضع الكاشير':'التحويل لوضع الكاشير','يخفي سعر الشراء والأرباح'],['log','📋','سجل التعديلات','كل اللي اتعمل في البرنامج']];
 return'<div class="sec" style="margin-top:4px">'+esc(S.settings.shop)+' <span>· '+(cashier?'الكاشير':'المالك')+'</span></div><div class="menu">'+M.filter(m=>!cashier||['buyInv','exp','cashier'].includes(m[0])).map(([a,i,t,s])=>'<button data-act="'+a+'"><i>'+i+'</i><div><b>'+t+'</b><small>'+s+'</small></div></button>').join('')+'</div>'+
 (S.sample?'<div class="card"><b>البرنامج فيه بيانات تجريبية</b><p class="mut" style="margin:4px 0 10px">المنتجات والعملاء اللي موجودين دلوقتي للتجربة بس.</p><button class="d" data-act="clearSample" style="width:100%">امسح البيانات التجريبية وابدأ</button></div>':'')}
function fSettings(){const T=S.settings;modal('الإعدادات',F('shop','اسم المحل',T.shop)+F('sub','تحت الاسم',T.sub)+'<div class="g2"><div>'+F('mgr','الإدارة',T.mgr)+'</div><div>'+F('phone','تليفون المحل',T.phone,'tel')+'</div></div>'+F('addr','العنوان',T.addr)+
 '<div class="g2"><div>'+F('low','تنبيه النواقص لما المقاس يقل عن',T.low,'number','min="0"')+'</div><div>'+F('days','اعرض الأقساط قبل ميعادها بكام يوم',T.days,'number','min="0"')+'</div></div>'+
 '<label for="tpl">رسالة تذكير القسط</label><textarea id="tpl" name="tpl" rows="6">'+esc(T.tpl)+'</textarea><div class="mut">بتتغير تلقائي: {الاسم} {المحل} {رقم_القسط} {المبلغ} {التاريخ} {المتبقي} {رقمي} {العنوان} {المدير}</div>'+gmailCard()+
 '<button type="button" class="d" id="wipe" style="width:100%;margin-top:12px">مسح كل البيانات</button>',fd=>{Object.assign(T,{shop:fd.get('shop').trim()||'التمساح للملابس',sub:fd.get('sub').trim(),mgr:fd.get('mgr').trim(),phone:fd.get('phone').trim(),addr:fd.get('addr').trim(),low:num(fd.get('low'))|0,days:num(fd.get('days'))|0,tpl:fd.get('tpl')});logA('set','تعديل الإعدادات');save();render();toast('اتحفظت الإعدادات')});
 $('#wipe').onclick=()=>ask('متأكد؟ كل البيانات هتتمسح نهائي.',()=>{S=def();save();close();render();toast('اتمسح كل حاجة')});
 const gm=$('#gmBtn');if(gm)gm.onclick=()=>{const em=$('#f_gm').value.trim(),pw=$('#f_gp').value.replace(/\s/g,'');if(!/^[^@\s]+@[^@\s]+$/.test(em)){toast('اكتب الجيميل صح');return}try{Android.setMail(em,pw,true,parseInt($('#f_ev').value)||2);toast('اتحفظ — النسخ هيتبعت أوتوماتيك')}catch(e){toast('حصلت مشكلة')}};
 const gn=$('#gmNow');if(gn)gn.onclick=()=>{try{syncNative();Android.sendNow();toast('جاري إرسال نسخة على الجيميل...')}catch(e){}}}
function gmailCard(){let m=null;try{m=window.Android&&Android.mailStatus?JSON.parse(Android.mailStatus()):null}catch(e){}
 if(!m)return'<div class="card" style="margin-top:12px"><b>نسخة احتياطية أوتوماتيك على الجيميل</b><p class="mut" style="margin:4px 0 0">شغالة في برنامج الموبايل (APK).</p></div>';
 return'<div class="card" style="margin-top:12px"><b>نسخة أوتوماتيك على الجيميل</b> '+(m.enabled&&m.hasPass?'<span class="tag ok">شغالة</span>':'<span class="tag late">مش متفعلة</span>')+(m.err?'<div class="red mut">'+esc(m.err)+'</div>':'')+F('gm','الجيميل',m.email,'email')+F('gp','كلمة سر التطبيقات (16 حرف)','','password','placeholder="'+(m.hasPass?'متسجلة ✓':'')+'"')+SEL('ev','كل قد إيه',[[1,'كل يوم'],[2,'كل يومين'],[7,'كل أسبوع']],m.every||2)+'<div class="g2" style="gap:8px;margin-top:8px"><button type="button" class="p" id="gmBtn">حفظ</button><button type="button" id="gmNow">ابعت دلوقتي</button></div></div>'}
function backup(){const txt=JSON.stringify(S);try{if(window.Android&&Android.share){Android.share('نسخة احتياطية - '+S.settings.shop+' - '+today(),txt);return}}catch(e){}
 modal('نسخة احتياطية','<p class="mut" style="margin-top:0">انسخ النص ده وابعته لنفسك على واتساب. عشان ترجّعه: الصقه في خانة الاسترجاع.</p><textarea rows="6" readonly id="bk">'+esc(txt)+'</textarea><button type="button" class="p big" id="cp" style="margin-top:8px">نسخ</button><div class="sec">استرجاع نسخة</div><input type="file" id="bkf" accept=".json,.txt"><textarea id="bkt" rows="4" placeholder="أو الصق النسخة هنا" style="margin-top:8px"></textarea><button type="button" id="rs" style="width:100%;margin-top:8px">استرجاع</button>');
 $('#cp').onclick=()=>{navigator.clipboard.writeText(txt).then(()=>toast('اتنسخ'),()=>{$('#bk').select();toast('حدد النص وانسخه')})};
 $('#bkf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bkt').value=r.result;toast('الملف اتقرا — دوس استرجاع')};r.readAsText(f)};
 $('#rs').onclick=()=>{try{const d=JSON.parse($('#bkt').value);if(!d.products||!d.sales)throw 0;ask('البيانات الحالية هتتبدل بالنسخة دي. تكمل؟',()=>{S=Object.assign(def(),d);S.settings=Object.assign(defSet(),d.settings||{});logA('sys','استرجاع نسخة');save();close();render();toast('تم الاسترجاع')})}catch(e){toast('دي مش نسخة صحيحة')}}}
const LK={sale:['بيع','#2b7a64'],ret:['مرتجع','#d23b3b'],buy:['شراء','#1f9d63'],prod:['منتج','#7c3aed'],cust:['عميل','#c98a1b'],sup:['مورد','#0f766e'],pay:['دفع','#2563eb'],exp:['مصروف','#b45309'],del:['حذف','#b91c1c'],wa:['واتساب','#25a85a'],set:['إعدادات','#64748b'],sys:['النظام','#475569']};
function showLog(){const L=S.log.slice().reverse().slice(0,300);modal('سجل التعديلات',L.length?L.map(e=>{const k=LK[e.k]||['',''];return'<div class="item row" style="align-items:flex-start"><span class="tag" style="background:'+k[1]+';color:#fff">'+k[0]+'</span><div class="sp">'+esc(e.x)+'<div class="mut">'+new Date(e.t).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})+'</div></div></div>'}).join(''):'<div class="empty">لسه مفيش حاجة</div>')}

/* ===== events ===== */
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-pick],[data-ep],[data-open],[data-sup],[data-inv]');if(!b)return;const ds=b.dataset;
 if(ds.t){tab=ds.t;q='';render();scrollTo(0,0);return}
 if(ds.pick){pickVar(ds.pick);return}
 if(ds.addv){const[p,v]=ds.addv.split('|');addCart(p,v);return}
 if(ds.cq){const[i,d]=ds.cq.split('|').map(Number);const c=cart[i];if(!c)return;if(d>0){const v=(prod(c.pid)||{vars:[]}).vars.find(x=>x.id===c.vid);if(v&&c.qty>=v.qty){toast('مفيش كمية أكتر');return}}c.qty+=d;if(c.qty<=0)cart.splice(i,1);render();return}
 if(ds.sec!==undefined){sec=ds.sec;render();return}
 if(ds.rp){rp=ds.rp;render();return}
 if(ds.ep){fProd(prod(ds.ep));return}
 if(ds.open){openCust(ds.open);return}
 if(ds.sup){openSup(ds.sup);return}
 if(ds.inv){showInv(ds.inv);return}
 if(ds.pay){fPay(ds.pay);return}
 if(ds.wa){const d=S.debts.find(x=>x.id===ds.wa);if(d){const c=cust(d.cid);if(!c.phone){toast('العميل ملوش رقم');return}logA('wa','تذكير واتساب لـ '+c.name);save();openWA(waLink(c.phone,msgFor(d)))}return}
 const a=ds.act;if(!a)return;
 if(a==='dev')openWA(waLink('01123840671','السلام عليكم يا أستاذ محمد، أنا من '+S.settings.shop+'\n'));
 else if(a==='clearCart'){cart=[];sellDisc=0;render()}
 else if(a==='payCash'){if(cart.length)ask('تأكيد بيع كاش بمبلغ '+money(cart.reduce((s,c)=>s+c.qty*c.price,0)-sellDisc)+'؟',()=>doSale('cash','',cart.reduce((s,c)=>s+c.qty*c.price,0)-sellDisc,null))}
 else if(a==='payDebt'){if(cart.length)fDebtSale()}
 else if(a==='newProd')fProd();else if(a==='newCust')fCust();else if(a==='newSup')fSup();
 else if(a==='buyInv')fPurchase();else if(a==='exp')fExp();else if(a==='settings')fSettings();else if(a==='backup')backup();else if(a==='log')showLog();
 else if(a==='cashier'){cashier=!cashier;try{localStorage.setItem('temsah_cashier',cashier?'1':'0')}catch(x){}render();toast(cashier?'اتحولت لوضع الكاشير':'رجعت لوضع المالك')}
 else if(a==='clearSample')ask('تمسح البيانات التجريبية وتبدأ على نضافة؟',()=>{S=def();save();render();toast('جاهز — ابدأ ضيف منتجاتك')})});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='srch'){q=t.value;const pos=t.selectionStart;render();const s=$('#srch');s.focus();try{s.setSelectionRange(pos,pos)}catch(x){}}
 if(t.id==='disc'){sellDisc=Math.max(0,num(t.value));const tot=cart.reduce((a,c)=>a+c.qty*c.price,0);$('#totL').textContent=money(tot-sellDisc)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('on'))close();
 if(e.key==='Enter'&&e.target.id==='srch'&&tab==='sell'){e.preventDefault();const f=q.trim();const p=S.products.find(x=>x.code===f)||(S.products.filter(x=>match(x,f)).length===1?S.products.find(x=>match(x,f)):null);if(p){if(p.vars.length===1&&p.vars[0].qty>0)addCart(p.id,p.vars[0].id);else pickVar(p.id)}else toast('مفيش منتج بالكود ده')}});
window.addEventListener('popstate',()=>close());
render();syncNative();
try{if(window.Android&&Android.versionCode)$('#verLbl').textContent='الإصدار 1.'+Android.versionCode()}catch(e){}
}
</script>
